<div class="sidebar" id="sidebar">
    %HEADER%
    <div id="universalSettingsContainer" style="display:flex;flex-direction:column;gap:4px;width:100%;margin-bottom:4px;">%SETTINGS%</div>
    %CACHE_CONTROLS%
    <div class="premium-panel" id="sidebarUpdatePanel" style="margin-top:4px;margin-bottom:8px;padding:12px;display:flex;flex-direction:column;gap:10px;">
        <div style="text-align:center;position:relative;display:flex;justify-content:center;align-items:center;gap:6px;">
            <span id="sidebarUpdateTitle" style="color:var(--amber);font-weight:900;font-size:0.85rem;letter-spacing:1.5px;text-transform:uppercase;">UPDATE STATUS</span>
            <span id="updateRedDot" style="display:none;width:8px;height:8px;background-color:#ef4444;border-radius:50%;box-shadow:0 0 8px #ef4444;"></span>
        </div>
        <table id="updateInfoTable" style="width:100%;border-collapse:collapse;font-size:0.75rem;border:1px solid rgba(255,215,0,0.15);border-radius:8px;overflow:hidden;background:rgba(0,0,0,0.3);">
            <tbody>
                <tr>
                    <td id="tableVerLabel" style="padding:8px 10px;color:var(--amber);font-weight:800;width:50%;">INSTALLED VERSION</td>
                    <td id="tableCurrentVer" style="padding:8px 10px;color:#fff;font-weight:bold;text-align:right;">-</td>
                </tr>
            </tbody>
        </table>
        <button id="btnUpdateAction" onclick="window.handleUpdateClick()" class="btn" style="width:100%;height:34px;font-size:0.75rem;font-weight:800;background:rgba(255,255,255,0.03);color:var(--amber);border:1px solid rgba(255,215,0,0.2);transition:all 0.2s;">FETCH NEW UPDATE</button>
        <button aria-label="Refresh App" onclick="window.location.reload(true)" class="btn" style="width:100%;height:34px;font-size:0.75rem;font-weight:800;background:rgba(255,255,255,0.03);color:var(--amber);border:1px solid rgba(255,215,0,0.2);transition:all 0.2s;">REFRESH APP</button>
    </div>
    <button onclick="window.resetDefaults()" aria-label="Restore Defaults" class="btn danger-btn" style="margin-top:auto">RESTORE DEFAULTS</button>
</div>
