<div class="premium-panel" id="bkmTabsPanel" style="margin-bottom:0;padding:8px">
    <div style="display:flex;justify-content:center">
        <div id="bkmTabSingle" role="tab" tabindex="0" aria-label="Single Bookmarks Tab" onclick="switchBkmTab('SINGLE')" style="flex:1;text-align:center;padding:6px;cursor:pointer;font-weight:bold;color:var(--amber);border-bottom:3px solid var(--amber);transition:all .3s;font-size:.8rem;line-height:1.2;">SINGLE<br>CHARACTERS</div>
        <div id="bkmTabCombined" role="tab" tabindex="0" aria-label="Combined Bookmarks Tab" onclick="switchBkmTab('COMBINED')" style="flex:1;text-align:center;padding:6px;cursor:pointer;font-weight:bold;color:var(--text-muted);border-bottom:none;transition:all .3s;font-size:.8rem;line-height:1.2;">COMBINED<br>CHARACTERS</div>
    </div>
</div>
